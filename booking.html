<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Rezervē izmēģinājuma treniņu | PadelByGu</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>

<body class="booking-page" data-page="booking">

  <main>
    <section class="success-section">
      <div class="section-inner">

        <article class="success-card">

          <p class="eyebrow">
            Izmēģinājuma treniņš · €15
          </p>

          <h1>
            Rezervē savu treniņu 🎾
          </h1>

          <p>
            Izvēlies sev piemērotu laiku un apmaksā €15.
            Pēc rezervācijas saņemsi apstiprinājumu e-pastā.
          </p>

          <a
            class="button button-primary js-external-booking"
            href="https://book.padelbygu.com/widget/bookings/padelbygu-trial"
          >
            Izvēlēties laiku
          </a>

        </article>

      </div>
    </section>
  </main>

  <div
    class="cookie-banner"
    id="cookieBanner"
    hidden
    role="dialog"
    aria-live="polite"
    aria-label="Sīkdatņu izvēle"
  >
    <div class="cookie-banner__content">

      <div>
        <strong>Sīkdatnes</strong>

        <p>
          Mēs izmantojam sīkdatnes vietnes darbībai un,
          ar Tavu piekrišanu, reklāmu rezultātu mērīšanai.
        </p>

        <a href="/sikdatnu-politika">
          Uzzināt vairāk
        </a>
      </div>

      <div class="cookie-banner__actions">

        <button
          class="cookie-button cookie-button--secondary"
          id="cookieReject"
          type="button"
        >
          Tikai nepieciešamās
        </button>

        <button
          class="cookie-button cookie-button--primary"
          id="cookieAccept"
          type="button"
        >
          Pieņemt visas
        </button>

      </div>

    </div>
  </div>

  <script src="script.js"></script>

  <script>
    document
      .querySelector(".js-external-booking")
      ?.addEventListener("click", function () {

        if (
          typeof trackBookingIntent === "function"
        ) {
          trackBookingIntent();
        }

      });
  </script>

</body>
</html>
